_schema-version: 3.1.0
ID: custom-btp-architecture
version: 1.0.0
description: Empty canvas ready for designing custom SAP BTP architecture topologies.
parameters:
  enable-parallel-deployments: true
modules:
  - name: custom-orders-backend
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    buildParameters:
      builder: npm
      build-result: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    requires:
      - name: orders-db-hdi
      - name: sap-xsuaa-service
  - name: sap-hana-cloud-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    buildParameters:
      builder: npm
      build-result: gen/db
    requires:
      - name: orders-db-hdi
  - name: app-router
    type: approuter.nodejs
    path: app/
    parameters:
      disk-quota: 256M
      memory: 128M
    requires:
      - name: sap-xsuaa-service
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: '~{srv-url}'
          forwardAuthToken: true
resources:
  - name: sap-xsuaa-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: custom-btp-architecture
        tenant-mode: dedicated
  - name: orders-db-hdi
    type: com.sap.xs.hana
    parameters:
      service: hana
      service-plan: hdi-shared