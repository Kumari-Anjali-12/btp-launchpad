_schema-version: '3.1.0'
ID: employee-leave-management
version: 1.0.0
description: "Enterprise Employee Leave Management System on SAP BTP"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --production
        - npx cds build --production

modules:
  # -------------------- SERVER MODULE (Node.js CAP) --------------------
  - name: employee-leave-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: employee-leave-db
      - name: employee-leave-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # -------------------- DATABASE DEPLOYER (HANA HDI) --------------------
  - name: employee-leave-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: employee-leave-db

  # -------------------- APPLICATION ROUTER MODULE -----------------------
  - name: employee-leave-approuter
    type: approuter.nodejs
    path: app/approuter
    parameters:
      memory: 128M
      disk-quota: 256M
    requires:
      - name: employee-leave-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  # -------------------- HANA CLOUD HDI CONTAINER ------------------------
  - name: employee-leave-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # -------------------- XSUAA AUTHENTICATION SERVICE -------------------
  - name: employee-leave-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: employee-leave-management
        tenant-mode: dedicated
